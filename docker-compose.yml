# Kenya Airways — full stack in containers.
#   1) ./setup.sh            (creates apps/api/.env with generated secrets)
#   2) docker compose up -d --build
#   3) docker compose run --rm api pnpm db:seed
# User app  → http://localhost:3000   Admin → http://localhost:3001
# API       → http://localhost:4100/api/v1
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: kenyaairways
      POSTGRES_PASSWORD: kenyaairways
      POSTGRES_DB: kenyaairways
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kenyaairways -d kenyaairways']
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: apps/api/.env
    environment:
      PORT: '4100'
      DATABASE_URL: postgresql://kenyaairways:kenyaairways@db:5432/kenyaairways
      REDIS_URL: redis://redis:6379
      API_PUBLIC_URL: http://localhost:4100
      NEXT_PUBLIC_API_URL: http://localhost:4100
      WEB_PUBLIC_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
    ports:
      - '4100:4100'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_PUBLIC_URL: http://localhost:4100
        NEXT_PUBLIC_API_URL: http://localhost:4100
    depends_on:
      - api
    ports:
      - '3000:3000'

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        API_PUBLIC_URL: http://localhost:4100
        NEXT_PUBLIC_API_URL: http://localhost:4100
        NEXT_PUBLIC_ADMIN_URL: http://localhost:3001
    depends_on:
      - api
    ports:
      - '3001:3001'

volumes:
  dbdata:
  redisdata:
