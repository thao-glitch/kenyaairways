name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kenyaairways
          POSTGRES_PASSWORD: kenyaairways_dev
          POSTGRES_DB: kenyaairways
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kenyaairways -d kenyaairways"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://kenyaairways:kenyaairways_dev@localhost:5432/kenyaairways
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate local secrets
        run: node scripts/bootstrap.mjs
      - name: Build shared package
        run: pnpm --filter @kenyaairways/shared build
      - name: Migrate
        run: pnpm db:push
      - name: Seed
        run: pnpm db:seed
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  docker:
    name: Docker build · Soak · Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Only playwright + the workspace config are needed; soak.mjs is
      # dependency-free but lives in the workspace scripts.
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate local secrets
        run: node scripts/bootstrap.mjs
      - name: Build images and start the stack (migrate → seed → serve)
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Stack is ready
        run: |
          curl -fsS http://localhost:4100/healthz
          curl -fsS http://localhost:4100/readyz
          curl -fsS http://localhost:3000 >/dev/null
          curl -fsS "http://localhost:4100/api/v1/flights/search?origin=NBO&destination=MBA&date=$(date -d '+14 days' +%F)" | grep -q '"results":\[{' || { echo 'seed missing'; exit 1; }
      - name: Soak (30s, full book→pay→issue journey)
        run: pnpm soak
      - name: Playwright — search → book → pay → seat → check-in → pass
        run: |
          pnpm --filter @kenyaairways/web exec playwright install --with-deps chromium
          WEB_URL=http://localhost:3000 API_URL=http://localhost:4100 pnpm --filter @kenyaairways/web test:e2e
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -n 500
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose down -v
